# Production overrides — extend docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: always
    # Remove bind mount (baked into image)
    volumes:
      - uploads_data:/app/uploads
    environment:
      APP_ENV: production
      DEBUG: "false"
      USE_SQLITE: "false"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --loop uvloop
      --access-log
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  db:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    restart: always

  prometheus:
    restart: always

  grafana:
    restart: always
    environment:
      GF_SERVER_ROOT_URL: "https://monitoring.devtrack.ai"
