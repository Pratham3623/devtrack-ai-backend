# ==============================================================================
# DevTrack AI — Production Multi-Container Orchestration (docker-compose.prod.yml)
# Deployment: DigitalOcean Droplet / AWS EC2 / On-Premise Production VM
# ==============================================================================

services:
  # ── FastAPI Application Service ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devtrack-ai-api:production
    container_name: devtrack_api_prod
    restart: always
    environment:
      - APP_ENV=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["*"]}
    volumes:
      - prod_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ── PostgreSQL Production Database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: devtrack_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtrack_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-devtrack_production_db}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devtrack_admin} -d ${POSTGRES_DB:-devtrack_production_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ── Redis Key-Value & Pub/Sub Cache ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devtrack_redis_prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ── Nginx Production Reverse Proxy & TLS Gateway ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: devtrack_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app/static:/usr/share/nginx/html/static:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Prometheus Telemetry Collector ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: devtrack_prometheus_prod
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prod_prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Grafana Metrics Dashboard ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: devtrack_grafana_prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-AdminPass123!}
    volumes:
      - prod_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_uploads:
  prod_prometheus_data:
  prod_grafana_data:
